<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Optinull - routing map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <div id="map" role="application" aria-label="Map for placing the depot and customers"></div>

    <aside class="panel">
      <header>
        <h1>Routing map</h1>
        <p id="hint" class="hint"></p>
      </header>

      <section class="modes" role="group" aria-label="What a tap on the map does">
        <button id="mode-depot" type="button" aria-pressed="true">Place depot</button>
        <button id="mode-customer" type="button" aria-pressed="false">Add customers</button>
      </section>

      <section class="fleet">
        <label>Trucks
          <input id="vehicles" type="number" inputmode="numeric" min="1" step="1" value="3">
        </label>
        <label>Truck capacity
          <input id="capacity" type="number" inputmode="numeric" min="1" step="1" value="20">
        </label>
        <label>Demand of new customers
          <input id="new-demand" type="number" inputmode="numeric" min="1" step="1" value="1">
        </label>
      </section>

      <section>
        <h2>Customers <span id="customer-count" class="count"></span></h2>
        <ol id="customer-list" class="customers"></ol>
        <p id="empty" class="hint">No customers yet. Choose "Add customers", then tap the map.</p>
      </section>

      <section id="summary" class="summary" aria-live="polite"></section>
      <div id="messages" class="messages" role="status" aria-live="polite"></div>

      <footer class="actions">
        <button id="validate" type="button">Check problem</button>
        <button id="clear" type="button" class="secondary">Clear all</button>
      </footer>
    </aside>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
